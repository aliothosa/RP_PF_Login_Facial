[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rp_face_login"
version = "0.1.0"
description = "Autenticación/identificación facial 1:N para login en KDE Plasma (RP_PF_Login_Facial)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "aliothosa" },
]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.15",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pillow>=10.0",
]
dev = [
    "pytest>=7.4",
    "pyinstaller>=6.0",
]

[project.scripts]
rp-face-login = "rp_face_login.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
